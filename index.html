<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1b1f27">
<title>Sesli Kitap</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">

  <header>
    <h1>Sesli Kitap</h1>
  </header>

  <section id="upload-section">
    <label id="upload-label" for="pdf-input">📄 PDF Seç</label>
    <input type="file" id="pdf-input" accept="application/pdf">
    <p id="status-text">Başlamak için bir PDF seç.</p>
  </section>

  <section id="reader-section" hidden>

    <div id="page-info">
      <button id="prev-page-btn" aria-label="Önceki sayfa">⏮ Sayfa</button>
      <span id="page-indicator">Sayfa - / -</span>
      <button id="next-page-btn" aria-label="Sonraki sayfa">Sayfa ⏭</button>
    </div>

    <div id="text-display" aria-live="polite"></div>

    <div id="controls">

      <div class="control-row primary-controls">
        <button id="prev-sentence-btn" aria-label="Önceki cümle">⏮</button>
        <button id="play-pause-btn">▶️ Oku</button>
        <button id="next-sentence-btn" aria-label="Sonraki cümle">⏭</button>
      </div>

      <div class="control-row slider-row">
        <label for="rate-slider">Hız: <span id="rate-value">1.0x</span></label>
        <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
      </div>

      <div class="control-row slider-row">
        <label for="pitch-slider">Ton: <span id="pitch-value">1.0</span></label>
        <input type="range" id="pitch-slider" min="0" max="2" step="0.1" value="1">
      </div>

      <div class="control-row">
        <label for="voice-select">Ses:</label>
        <select id="voice-select"></select>
      </div>

      <div class="control-row checkbox-row">
        <label><input type="checkbox" id="auto-page-checkbox" checked> Sayfa bitince otomatik devam et</label>
      </div>

      <p id="wakelock-note">Not: Ekranın kilitlenmemesi için okuma sırasında telefonu açık tut.</p>

    </div>

  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="script.js"></script>
</body>
</html>
